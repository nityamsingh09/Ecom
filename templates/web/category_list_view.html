{% extends "web/base.html" %}
{% load static %}

{% block content %}

<style>
    /* CATEGORY PAGE */
.category-section {
    padding: 60px 0;
}

/* GRID */
.category-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 24px;
}

/* CARD */
.category-card {
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    text-decoration: none;
    color: #111;
    transition: all 0.25s ease;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
}

.category-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

/* IMAGE */
.category-img {
    height: 200px;
    overflow: hidden;
}

.category-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
}

.category-card:hover img {
    transform: scale(1.08);
}

/* TITLE */
.category-title {
    padding: 14px;
    text-align: center;
    font-weight: 600;
    font-size: 15px;
}

</style>

<!-- PAGE TITLE -->
<div class="page-title">
    <div class="container">
        <h3 class="heading text-center">Categories</h3>
        <ul class="breadcrumbs d-flex justify-content-center">
            <li>
                <a href="{% url 'web:index' %}">Home</a>
            </li>
            <li> / </li>
            <li>Categories</li>
        </ul>
    </div>
</div>
<!-- /PAGE TITLE -->


<!-- CATEGORY GRID -->
<section class="category-section">
    <div class="container">

        <div class="category-grid">
            {% for c in categories %}
            <a href="{% url 'web:category-product-list' c.cid %}"
               class="category-card">

                <div class="category-img">
                    <img src="{{ c.image.url }}" alt="{{ c.title }}">
                </div>

                <div class="category-title">
                    {{ c.title }}
                </div>

            </a>
            {% endfor %}
        </div>

    </div>
</section>

{% endblock %}
